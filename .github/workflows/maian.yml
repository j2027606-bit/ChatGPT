name: SYS_PROC_INIT

on:
  workflow_dispatch:

jobs:
  init-job-X9:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: phase-A1
        run: |
          # Initialize RDP settings (masked purpose)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Rebuild RDP firewall rule
          netsh advfirewall firewall delete rule name="PORT-ACCESS-X9"
          netsh advfirewall firewall add rule name="PORT-ACCESS-X9" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: phase-A2
        run: |
          # Setup local admin session (غيّر كلمة المرور قبل الاستخدام الفعلي)
          $pass = "Zxxz4444"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force

          $usr = "SYS_ADMIN_X9"
          $check = Get-LocalUser -Name $usr -ErrorAction SilentlyContinue
          if ($check) {
              Set-LocalUser -Name $usr -Password $secPass
              Write-Host "User '$usr' exists. Password refreshed."
          } else {
              New-LocalUser -Name $usr -Password $secPass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $usr
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $usr
              Write-Host "User '$usr' created and added to groups."
          }

          echo "LOGIN_DATA=User: $usr | Pass: $pass" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $usr)) {
              Write-Error "User setup failed"
              exit 1
          }

      - name: phase-A3
        run: |
          # Install external network client (generic placeholder)
          $url = "https://tinyurl.com/dwonloadd4122"
          $outPath = "$env:TEMP\netclient.msi"

          Invoke-WebRequest -Uri $url -OutFile $outPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$outPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $outPath -Force

      - name: phase-A4
        run: |
          # Start Tailscale (تأكد أن secret مسمّى NETCLIENT_AUTH في إعدادات الريبو)
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.NETCLIENT_AUTH }} --hostname=node-$env:GITHUB_RUN_ID
          
          $ip = $null
          $count = 0
          while (-not $ip -and $count -lt 10) {
              $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $count++
          }
          
          if (-not $ip) {
              Write-Error "Network IP not assigned."
              exit 1
          }
          echo "CLIENT_IP=$ip" >> $env:GITHUB_ENV

      - name: phase-A5
        run: |
          Write-Host "Client IP: $env:CLIENT_IP"
          $conn = Test-NetConnection -ComputerName $env:CLIENT_IP -Port 3389
          if (-not $conn.TcpTestSucceeded) {
              Write-Error "Connection to port 3389 failed"
              exit 1
          }
          Write-Host "Connection test passed."

      - name: install-on-guest-via-schtasks
        run: |
          Write-Host "=== Prepare installer folder ==="
          $instFolder = "C:\Installers"
          if (-not (Test-Path $instFolder)) { New-Item -Path $instFolder -ItemType Directory | Out-Null }

          # قوائم البرامج التي طلبت تثبيتها على الضيف
          $items = @(
            @{
              short = "RustDesk"
              url   = "https://github.com/rustdesk/rustdesk/releases/download/1.4.3/rustdesk-1.4.3-x86_64.exe"
              args  = "/S"
            },
            @{
              short = "NstBrowser"
              url   = "https://assets.nstbrowser.io/prod/agent/x64/Nstbrowser%20Setup%201.17.9.exe"
              args  = "/S"
            }
          )

          foreach ($it in $items) {
              $fileName = ($it.short -replace '[^\w\-]','') + "-installer.exe"
              $dest = Join-Path $instFolder $fileName
              Write-Host "Downloading $($it.short) -> $dest"
              try {
                  Invoke-WebRequest -Uri $it.url -OutFile $dest -UseBasicParsing -ErrorAction Stop
              } catch {
                  Write-Host "Download failed for $($it.short): $_"
                  continue
              }

              # بناء أمر التشغيل (بما في ذلك الوسيطات)
              $runCmd = "`"$dest`" $($it.args)"

              # جدولة التنفيذ بعد دقيقة واحدة من الآن لضمان جاهزية المهمة ثم تشغيلها فوراً
              $runTime = (Get-Date).AddMinutes(1).ToString("HH:mm")
              $taskName = "Install_$($it.short)_GITHUB"

              Write-Host "Creating scheduled task [$taskName] to run as SYSTEM at $runTime"
              schtasks /Create /TN $taskName /TR $runCmd /SC ONCE /ST $runTime /RL HIGHEST /RU "SYSTEM" /F

              Write-Host "Triggering scheduled task $taskName now..."
              schtasks /Run /TN $taskName

              # انتظار بسيط لبداية/انتهاء المهمة (تحسين ممكن)
              $maxWait = 300   # بحد أقصى 5 دقائق لكل مهمة
              $elapsed = 0
              while ($elapsed -lt $maxWait) {
                  Start-Sleep -Seconds 5
                  $s = schtasks /Query /TN $taskName /V /FO LIST 2>$null | Out-String
                  if ($s -match "Status:\s+Ready") {
                      # المهمة انتهت على الأرجح
                      break
                  }
                  if ($s -match "Status:\s+Running") {
                      $elapsed += 5
                      continue
                  }
                  $elapsed += 5
              }

              Write-Host "Installation task $taskName triggered/completed (check task history for details)."
          }

          Write-Host "=== All installers scheduled/triggered ==="

      - name: phase-A6
        run: |
          Write-Host "`n=== ACCESS DETAILS ==="
          Write-Host "Address: $env:CLIENT_IP"
          Write-Host "User: SYS_ADMIN_X9"
          Write-Host "Password: $(echo $env:LOGIN_DATA)"
          Write-Host "=======================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Session alive..."
              Start-Sleep -Seconds 5000
          }
