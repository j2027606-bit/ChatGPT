name: SYS_PROC_INIT

on:
  workflow_dispatch:

jobs:
  init-job-X9:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: phase-A1
        run: |
          # === تفعيل RDP وتهيئة الجدار الناري ===
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="PORT-ACCESS-X9" 2>$null || Write-Host "No existing rule to delete"
          netsh advfirewall firewall add rule name="PORT-ACCESS-X9" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: phase-A2
        run: |
          # === إنشاء أو تحديث مستخدم محلي بصلاحيات إدارية ===
          $pass = "Zxxz4444"               # غيّر هذه القيمة أو استخدم secrets
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force
          $usr = "SYS_ADMIN_X9"

          $exists = Get-LocalUser -Name $usr -ErrorAction SilentlyContinue
          if ($exists) {
              Set-LocalUser -Name $usr -Password $secPass
              Write-Host "Existing user '$usr' password updated."
          } else {
              New-LocalUser -Name $usr -Password $secPass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $usr
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $usr
              Write-Host "User '$usr' created and granted groups."
          }

          echo "LOGIN_DATA=User: $usr | Pass: $pass" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $usr)) {
              Write-Error "User creation/check failed"
              exit 1
          }

      - name: phase-A3
        run: |
          # === تنزيل مثبت شبكة (placeholder) وتشغيله بصمت ===
          $url = "https://tinyurl.com/dwonloadd4122"
          $outPath = "$env:TEMP\netclient.msi"
          try {
              Invoke-WebRequest -Uri $url -OutFile $outPath -UseBasicParsing -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i", "`"$outPath`"", "/quiet", "/norestart" -Wait
              Remove-Item $outPath -Force -ErrorAction SilentlyContinue
              Write-Host "Network client installed (placeholder)."
          } catch {
              Write-Warning "Network client download/install failed: $_"
          }

      - name: phase-A4
        run: |
          # === بدء Tailscale (تأكد من وجود secret NETCLIENT_AUTH) ===
          $tailscaleExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (Test-Path $tailscaleExe) {
              & $tailscaleExe up --authkey=${{ secrets.NETCLIENT_AUTH }} --hostname=node-$env:GITHUB_RUN_ID
          } else {
              Write-Warning "Tailscale not found at expected path: $tailscaleExe"
          }

          $ip = $null
          $tries = 0
          while (-not $ip -and $tries -lt 12) {
              try { $ip = & $tailscaleExe ip -4 } catch {}
              Start-Sleep -Seconds 5
              $tries++
          }

          if (-not $ip) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }
          echo "CLIENT_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      - name: phase-A5
        run: |
          # === تحقق من اتصال TCP إلى RDP ===
          Write-Host "Testing connectivity to $env:CLIENT_IP:3389"
          $conn = Test-NetConnection -ComputerName $env:CLIENT_IP -Port 3389
          if (-not $conn.TcpTestSucceeded) {
              Write-Error "TCP connection to $env:CLIENT_IP:3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity OK"

      - name: install-and-place-files-on-guest
        run: |
          # === تنزيل المثبتات، نسخ RustDesk إلى Desktop، وتثبيت NstBrowser ===
          Write-Host "Preparing installer folder..."
          $instFolder = "C:\Installers"
          if (-not (Test-Path $instFolder)) { New-Item -Path $instFolder -ItemType Directory | Out-Null }

          $publicDesktop = "C:\Users\Public\Desktop"
          $userDesktop = Join-Path "C:\Users" "SYS_ADMIN_X9\Desktop"

          $apps = @(
            @{
              Name = "RustDesk"
              Url  = "https://github.com/rustdesk/rustdesk/releases/download/1.4.3/rustdesk-1.4.3-x86_64.exe"
              Action = "copy_to_desktop"
              DestName = "rustdesk-1.4.3-x86_64.exe"
              CheckPathPublic = Join-Path $publicDesktop "rustdesk-1.4.3-x86_64.exe"
              CheckPathUser = Join-Path $userDesktop "rustdesk-1.4.3-x86_64.exe"
            },
            @{
              Name = "NstBrowser"
              Url  = "https://assets.nstbrowser.io/prod/agent/x64/Nstbrowser%20Setup%201.17.9.exe"
              Action = "install"
              SilentArgs = "/S"
              CheckPath = "C:\Program Files\Nstbrowser\nstbrowser.exe"
            }
          )

          foreach ($app in $apps) {
              $safe = ($app.Name -replace '[^\w\-]','')
              $destFile = Join-Path $instFolder ("{0}-installer.exe" -f $safe)
              Write-Host "Downloading $($app.Name) -> $destFile"
              try {
                  Invoke-WebRequest -Uri $app.Url -OutFile $destFile -UseBasicParsing -ErrorAction Stop
              } catch {
                  Write-Warning "Failed to download $($app.Name): $_"
                  continue
              }

              if ($app.Action -eq "copy_to_desktop") {
                  # نسخ الملف إلى Public Desktop
                  $destPublic = Join-Path $publicDesktop $app.DestName
                  try {
                      Copy-Item -Path $destFile -Destination $destPublic -Force
                      Write-Host "Copied $($app.Name) installer to Public Desktop: $destPublic"
                  } catch {
                      Write-Warning "Failed to copy to Public Desktop: $_"
                  }

                  # إن وجد Desktop للمستخدم SYS_ADMIN_X9 انسخ إليه أيضاً
                  if (Test-Path $userDesktop) {
                      try {
                          Copy-Item -Path $destFile -Destination (Join-Path $userDesktop $app.DestName) -Force
                          Write-Host "Also copied to user desktop: $userDesktop"
                      } catch {
                          Write-Warning "Failed to copy to user desktop: $_"
                      }
                  } else {
                      Write-Host "User desktop not found at $userDesktop; skipping user-desktop copy."
                  }

                  # تحقق من الوجود
                  if (Test-Path $app.CheckPathPublic) {
                      Write-Host "RustDesk installer present on Public Desktop ✅"
                  } else {
                      Write-Warning "RustDesk installer not found on Public Desktop."
                  }

              } elseif ($app.Action -eq "install") {
                  # محاولة التثبيت الصامت ثم التفاعلي إذا لزم الأمر
                  $installed = $false
                  if ($app.SilentArgs) {
                      Write-Host "Attempting silent install for $($app.Name) with args [$($app.SilentArgs)]"
                      try {
                          Start-Process -FilePath $destFile -ArgumentList $app.SilentArgs -Wait -NoNewWindow -ErrorAction Stop
                          $installed = $true
                          Write-Host "Silent install process exited (check path)."
                      } catch {
                          Write-Warning "Silent install attempt failed: $_"
                          $installed = $false
                      }
                  }

                  if (-not $installed) {
                      Write-Host "Attempting interactive install for $($app.Name) (will wait)..."
                      try {
                          Start-Process -FilePath $destFile -Wait -NoNewWindow -ErrorAction Stop
                          $installed = $true
                      } catch {
                          Write-Warning "Interactive install failed: $_"
                          $installed = $false
                      }
                  }

                  Start-Sleep -Seconds 8
                  if ($app.CheckPath -and (Test-Path $app.CheckPath)) {
                      Write-Host "$($app.Name) installed successfully ✅ (found $($app.CheckPath))"
                  } else {
                      Write-Warning "$($app.Name) may not be installed (expected at $($app.CheckPath))."
                  }
              } else {
                  Write-Warning "Unknown action for $($app.Name): $($app.Action)"
              }
          }

          Write-Host "Install/place step completed."

      - name: phase-A6
        run: |
          Write-Host "`n=== ACCESS DETAILS ==="
          Write-Host "Address: $env:CLIENT_IP"
          Write-Host "User: SYS_ADMIN_X9"
          Write-Host "Password: $(echo $env:LOGIN_DATA)"
          Write-Host "=======================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Session alive..."
              Start-Sleep -Seconds 5000
          }
