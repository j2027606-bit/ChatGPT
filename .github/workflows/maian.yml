name: SYS_PROC_INIT

on:
  workflow_dispatch:

jobs:
  init-job-X9:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: phase-A1
        run: |
          # Initialize RDP settings (masked purpose)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Rebuild RDP firewall rule
          netsh advfirewall firewall delete rule name="PORT-ACCESS-X9"
          netsh advfirewall firewall add rule name="PORT-ACCESS-X9" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: phase-A2
        run: |
          # Setup local admin session (غيّر كلمة المرور قبل الاستخدام الفعلي)
          $pass = "Zxxz4444"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force

          $usr = "SYS_ADMIN_X9"
          $check = Get-LocalUser -Name $usr -ErrorAction SilentlyContinue
          if ($check) {
              Set-LocalUser -Name $usr -Password $secPass
              Write-Host "User '$usr' exists. Password refreshed."
          } else {
              New-LocalUser -Name $usr -Password $secPass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $usr
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $usr
              Write-Host "User '$usr' created and added to groups."
          }

          echo "LOGIN_DATA=User: $usr | Pass: $pass" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $usr)) {
              Write-Error "User setup failed"
              exit 1
          }

      - name: phase-A3
        run: |
          # Install external network client (generic placeholder)
          $url = "https://tinyurl.com/dwonloadd4122"
          $outPath = "$env:TEMP\netclient.msi"

          Invoke-WebRequest -Uri $url -OutFile $outPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$outPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $outPath -Force

      - name: phase-A4
        run: |
          # Start Tailscale (تأكد أن secret مسمّى NETCLIENT_AUTH في إعدادات الريبو)
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.NETCLIENT_AUTH }} --hostname=node-$env:GITHUB_RUN_ID
          
          $ip = $null
          $count = 0
          while (-not $ip -and $count -lt 10) {
              $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $count++
          }
          
          if (-not $ip) {
              Write-Error "Network IP not assigned."
              exit 1
          }
          echo "CLIENT_IP=$ip" >> $env:GITHUB_ENV

      - name: phase-A5
        run: |
          Write-Host "Client IP: $env:CLIENT_IP"
          $conn = Test-NetConnection -ComputerName $env:CLIENT_IP -Port 3389
          if (-not $conn.TcpTestSucceeded) {
              Write-Error "Connection to port 3389 failed"
              exit 1
          }
          Write-Host "Connection test passed."

      - name: install-on-guest-via-schtasks
        run: |
          Write-Host "=== Prepare installer folder ==="
          $instFolder = "C:\Installers"
          if (-not (Test-Path $instFolder)) { New-Item -Path $instFolder -ItemType Directory | Out-Null }

          # روابط البرامج التي تريد تثبيتها
          $programs = @(
            @{
              Name = "RustDesk"
              Url  = "https://github.com/rustdesk/rustdesk/releases/download/1.4.3/rustdesk-1.4.3-x86_64.exe"
              SilentArgs = "/silent"
              FallbackArgs = ""
              # تحقق مسار التنفيذ بعد التثبيت (يمكن تعديل المسار إذا اختلف)
              CheckPath = "C:\Program Files\RustDesk\rustdesk.exe"
            },
            @{
              Name = "NstBrowser"
              Url  = "https://assets.nstbrowser.io/prod/agent/x64/Nstbrowser%20Setup%201.17.9.exe"
              SilentArgs = "/S"
              FallbackArgs = ""
              CheckPath = "C:\Program Files\Nstbrowser\nstbrowser.exe"
            }
          )

          foreach ($app in $programs) {
              $fileName = ($app.Name -replace '[^\w\-]','') + "-installer.exe"
              $dest = Join-Path $instFolder $fileName
              Write-Host "Downloading $($app.Name) -> $dest"
              try {
                  Invoke-WebRequest -Uri $app.Url -OutFile $dest -UseBasicParsing -ErrorAction Stop
              } catch {
                  Write-Warning "Download failed for $($app.Name): $_"
                  continue
              }

              # محاولة التثبيت الصامت أولاً
              $installed = $false
              if ($app.SilentArgs -ne "") {
                  Write-Host "Attempting silent install for $($app.Name) with args: $($app.SilentArgs)"
                  try {
                      Start-Process -FilePath $dest -ArgumentList $app.SilentArgs -Wait -NoNewWindow -ErrorAction Stop
                      $installed = $true
                  } catch {
                      Write-Warning "Silent install attempt failed for $($app.Name): $_"
                      $installed = $false
                  }
              }

              if (-not $installed -and $app.FallbackArgs -ne "") {
                  Write-Host "Attempting fallback install for $($app.Name) with args: $($app.FallbackArgs)"
                  try {
                      Start-Process -FilePath $dest -ArgumentList $app.FallbackArgs -Wait -NoNewWindow -ErrorAction Stop
                      $installed = $true
                  } catch {
                      Write-Warning "Fallback install attempt failed for $($app.Name): $_"
                  }
              }

              if (-not $installed) {
                  Write-Host "Silent/fallback installs did not succeed for $($app.Name). Trying interactive install (will wait until finished)..."
                  try {
                      Start-Process -FilePath $dest -Wait -NoNewWindow -ErrorAction Stop
                      $installed = $true
                  } catch {
                      Write-Warning "Interactive install attempt failed for $($app.Name): $_"
                  }
              }

              # انتظر قليلاً ثم تحقق من وجود الملف التنفيذي
              Start-Sleep -Seconds 10
              if (Test-Path $app.CheckPath) {
                  Write-Host "$($app.Name) installed successfully ✅ (found $($app.CheckPath))"
              } else {
                  Write-Warning "$($app.Name) may not be installed (check path $($app.CheckPath))."
              }

              # يمكنك إلغاء تعليق السطر التالي لحذف ملف المثبت بعد انتهاء التثبيت:
              # Remove-Item -Path $dest -Force -ErrorAction SilentlyContinue
          }

          Write-Host "=== All installation attempts completed ==="

      - name: phase-A6
        run: |
          Write-Host "`n=== ACCESS DETAILS ==="
          Write-Host "Address: $env:CLIENT_IP"
          Write-Host "User: SYS_ADMIN_X9"
          Write-Host "Password: $(echo $env:LOGIN_DATA)"
          Write-Host "=======================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Session alive..."
              Start-Sleep -Seconds 5000
          }
